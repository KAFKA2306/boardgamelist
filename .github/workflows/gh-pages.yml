name: Deploy MkDocs to GitHub Pages

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'scripts/audit_game_metadata.py'
      - 'scripts/build_game_catalog.py'
      - 'scripts/test-game-filter.mjs'
      - 'scripts/e2e-game-chooser.mjs'
      - '.github/workflows/gh-pages.yml'
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: mkdocs-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit game metadata
        run: python scripts/audit_game_metadata.py docs/games --report build/game-metadata-audit.json

      - name: Build catalog API into MkDocs source
        run: python scripts/build_game_catalog.py --games-dir docs/games --output-dir docs/api/v1

      - name: Verify catalog API before deploy
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('docs/api/v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'games.json').read_text(encoding='utf-8'))
          assert manifest['game_count'] == catalog['count'] == len(catalog['games'])
          for name, meta in manifest['files'].items():
              data = (root / name).read_bytes()
              assert len(data) == meta['bytes']
              assert hashlib.sha256(data).hexdigest() == meta['sha256']
          print({'game_count': catalog['count']})
          PY

      - name: Verify games index uses canonical catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/games/ja/index.md').read_text(encoding='utf-8')
          forbidden = ['total_games:', 'planned_games:', '追加予定ゲーム', '現在のゲーム (']
          found = [value for value in forbidden if value in text]
          if found:
              raise SystemExit(f'games index must not duplicate catalog data: {found}')
          if 'api/v1/games.json' not in text:
              raise SystemExit('games index must identify api/v1/games.json as its catalog source')
          PY

      - name: Test game chooser
        run: node scripts/test-game-filter.mjs

      - name: Build MkDocs site
        run: mkdocs build

      - name: Verify canonical typography authority
        run: |
          if grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' site; then
            echo 'MkDocs output must not load a second webfont authority' >&2
            exit 1
          fi
          grep -F 'kafka-tokens.css' site/stylesheets/extra.css
          grep -F 'var(--k-font-family-sans)' site/stylesheets/extra.css

      - name: Verify search discovery files
        run: |
          test -f site/robots.txt
          test -f site/sitemap.xml
          grep -Fx 'Sitemap: https://kafka2306.github.io/boardgamelist/sitemap.xml' site/robots.txt
          grep -F '<loc>https://kafka2306.github.io/boardgamelist/</loc>' site/sitemap.xml

      - name: Test Game Chooser in Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 > game-chooser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/site/games/ja/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/e2e-game-chooser.mjs

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        run: mkdocs gh-deploy --force

      - name: Verify deployed Game Chooser and catalog
        if: github.event_name == 'push'
        env:
          BASE_URL: https://kafka2306.github.io/boardgamelist
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['BASE_URL'].rstrip('/')
          urls = {
              'chooser': f'{base}/games/ja/',
              'games': f'{base}/api/v1/games.json',
              'manifest': f'{base}/api/v1/manifest.json',
          }

          def fetch_all():
              responses = {}
              for name, url in urls.items():
                  with urllib.request.urlopen(url, timeout=15) as response:
                      if response.status != 200:
                          raise RuntimeError(f'{name}: HTTP {response.status}')
                      responses[name] = response.read()
              return responses

          last_error = None
          for attempt in range(1, 13):
              try:
                  data = fetch_all()
                  catalog = json.loads(data['games'])
                  manifest = json.loads(data['manifest'])
                  if catalog.get('version') != 1:
                      raise RuntimeError(f"games.json version={catalog.get('version')!r}")
                  games = catalog.get('games')
                  if not isinstance(games, list) or catalog.get('count') != len(games):
                      raise RuntimeError('games.json count does not match games array')
                  games_meta = manifest.get('files', {}).get('games.json')
                  if not games_meta:
                      raise RuntimeError('manifest missing files[games.json]')
                  digest = hashlib.sha256(data['games']).hexdigest()
                  if games_meta.get('sha256') != digest:
                      raise RuntimeError('live games.json SHA-256 does not match manifest')
                  chooser = data['chooser'].decode('utf-8', errors='replace')
                  if 'game-chooser' not in chooser:
                      raise RuntimeError('Game Chooser marker is missing from deployed HTML')
                  print(json.dumps({
                      'attempt': attempt,
                      'game_count': len(games),
                      'games_sha256': digest,
                      'urls': urls,
                  }, ensure_ascii=False))
                  break
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as exc:
                  last_error = exc
                  print(f'production read-back attempt {attempt}/12 failed: {exc}')
                  if attempt == 12:
                      raise SystemExit(f'production read-back did not converge: {last_error}')
                  time.sleep(10)
          PY
