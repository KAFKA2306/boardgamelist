name: Deploy MkDocs to GitHub Pages

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'scripts/audit_game_metadata.py'
      - 'scripts/build_game_catalog.py'
      - 'scripts/test-game-filter.mjs'
      - '.github/workflows/gh-pages.yml'
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: mkdocs-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit game metadata
        run: python scripts/audit_game_metadata.py docs/games --report build/game-metadata-audit.json

      - name: Build catalog API into MkDocs source
        run: python scripts/build_game_catalog.py --games-dir docs/games --output-dir docs/api/v1

      - name: Verify catalog API before deploy
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('docs/api/v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'games.json').read_text(encoding='utf-8'))
          assert manifest['game_count'] == catalog['count'] == len(catalog['games'])
          for name, meta in manifest['files'].items():
              data = (root / name).read_bytes()
              assert len(data) == meta['bytes']
              assert hashlib.sha256(data).hexdigest() == meta['sha256']
          print({'game_count': catalog['count']})
          PY

      - name: Test game chooser
        run: node scripts/test-game-filter.mjs

      - name: Build MkDocs site
        run: mkdocs build

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        run: mkdocs gh-deploy --force
