name: Web quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/vnu-filter.txt"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/vnu-filter.txt"
      - ".github/workflows/web-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-conformance-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs strictly
        run: mkdocs build --strict

      - name: Nu HTML Checker on built site
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "${{ github.workspace }}/site:/data:ro" \
            -v "${{ github.workspace }}/.github/vnu-filter.txt:/vnu-filter.txt:ro" \
            ghcr.io/validator/validator:latest \
            vnu --skip-non-html --filterfile /vnu-filter.txt /data \
            > /tmp/vnu.log 2>&1
          status=$?
          set -e
          cat /tmp/vnu.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep ' error:' /tmp/vnu.log > /tmp/vnu-errors.log || true
          if [ ! -s /tmp/vnu-errors.log ]; then
            exit "$status"
          fi
          grep -Ev '^"file:/data/(categories/(deck-building|family|strategy)/index\.html|resources/quick-reference/index\.html|games/(bohnanza|wingspan|lost-ruins-of-arnak|dune-imperium)/index\.html|games/ja/(bohnanza|wingspan|lost-ruins-of-arnak|dune-imperium)/index\.html)"[^:]*: error: The heading ' \
            /tmp/vnu-errors.log > /tmp/unexpected-vnu-errors.log || true
          if [ -s /tmp/unexpected-vnu-errors.log ]; then
            echo 'Unexpected HTML conformance errors:'
            cat /tmp/unexpected-vnu-errors.log
            exit 1
          fi
          echo 'Only explicitly baselined legacy heading errors remain.'

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --exclude-mail
            --exclude '^https://fonts\.googleapis\.com/'
            --exclude '^https://fonts\.gstatic\.com/'
            --exclude '^https://tacta\.io/?$'
            --exclude '^https://boardgamegeek\.com/boardgame/37084/user-ranking/?$'
            README.md
            docs
            site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser-a11y-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: |
          pip install -r requirements.txt
          mkdocs build --strict

      - name: Install browser audit tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @playwright/test@1.57.0 @axe-core/playwright@4.12.1 @lhci/cli@0.15.1
          npx playwright install --with-deps chromium

      - name: Serve built site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/web-quality-http.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/web-quality-http.log
          exit 1

      - name: Playwright + axe
        run: |
          mkdir -p .web-quality
          cat > .web-quality/a11y.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test')
          const AxeBuilder = require('@axe-core/playwright').default

          test('documentation home has no automatically detectable accessibility violations', async ({ page }) => {
            await page.goto('http://127.0.0.1:4173/')
            await page.waitForLoadState('networkidle')
            const results = await new AxeBuilder({ page }).analyze()
            expect(results.violations).toEqual([])
          })
          EOF
          cat > .web-quality/playwright.config.js <<'EOF'
          module.exports = {
            testDir: '.',
            workers: 1,
            use: { browserName: 'chromium' },
          }
          EOF
          npx playwright test --config=.web-quality/playwright.config.js

      - name: Lighthouse CI
        run: |
          mkdir -p .web-quality
          cat > .web-quality/lighthouserc.json <<'EOF'
          {
            "ci": {
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.8}],
                  "categories:accessibility": ["error", {"minScore": 1}],
                  "categories:best-practices": ["error", {"minScore": 0.9}],
                  "categories:seo": ["error", {"minScore": 0.9}]
                }
              }
            }
          }
          EOF
          npx lhci collect --url=http://127.0.0.1:4173/ --numberOfRuns=1
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = '.lighthouseci'
          const reports = fs.readdirSync(dir).filter((name) => /^lhr-.*\.json$/.test(name)).sort()
          const report = JSON.parse(fs.readFileSync(path.join(dir, reports.at(-1)), 'utf8'))
          console.log(`Lighthouse SEO score: ${report.categories.seo.score}`)
          for (const ref of report.categories.seo.auditRefs) {
            const audit = report.audits[ref.id]
            if (typeof audit.score === 'number' && audit.score < 1) {
              console.log(`SEO audit failed: ${ref.id} score=${audit.score} title=${audit.title}`)
              if (audit.displayValue) console.log(`  ${audit.displayValue}`)
              if (audit.explanation) console.log(`  ${audit.explanation}`)
            }
          }
          NODE
          npx lhci assert --config=.web-quality/lighthouserc.json
