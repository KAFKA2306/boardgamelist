name: Consolidate Deep Abyss runtime

on:
  push:
    branches:
      - simplify-deep-abyss-runtime

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical runtime
        run: python scripts/consolidate_deep_abyss_runtime.py
      - name: Remove runtime fragments and temporary generator
        run: |
          git rm docs/play/deep-abyss/app-0{1,2,3,4,5,6,7,8}.txt
          git rm docs/play/deep-abyss/runtime-patch.txt docs/play/deep-abyss/runtime-flow-patch.txt docs/play/deep-abyss/runtime-hybrid-patch.txt docs/play/deep-abyss/runtime-test-hook.txt docs/play/deep-abyss/runtime-survey-patch.txt
          git rm scripts/consolidate_deep_abyss_runtime.py
          git rm .github/workflows/consolidate-deep-abyss-runtime.yml
          git add docs/play/deep-abyss/app.js
      - name: Verify generated runtime
        run: |
          node --check docs/play/deep-abyss/app.js
          ! grep -q "new Function" docs/play/deep-abyss/app.js
          ! grep -q "runtime-patch.txt" docs/play/deep-abyss/app.js
          ! grep -q "app-01.txt" docs/play/deep-abyss/app.js
      - name: Commit canonical runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "深淵侵蝕runtimeをapp.jsへ統合する"
          git push origin HEAD:simplify-deep-abyss-runtime
