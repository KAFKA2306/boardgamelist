name: Test Deep Abyss

on:
  pull_request:
    paths:
      - 'docs/play/deep-abyss/**'
      - 'scripts/test-deep-abyss.mjs'
      - '.github/workflows/deep-abyss-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/play/deep-abyss/**'
      - 'scripts/test-deep-abyss.mjs'
      - '.github/workflows/deep-abyss-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run engine regression test
        run: node scripts/test-deep-abyss.mjs
